- constraints: le
  distribution: uniform
  dtype: int
  generative: true
  high: 30
  low: 2
  name: mem
  owner: node
  type: resource
- constraints: le
  distribution: uniform
  dtype: int
  generative: true
  high: 6
  low: 1
